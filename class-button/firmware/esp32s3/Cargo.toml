# Standalone ESP-IDF workspace; intentionally excluded from the host workspace.
[workspace]

[package]
name = "class-button-esp32s3-firmware"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "receiver"
path = "src/bin/receiver.rs"
harness = false

[[bin]]
name = "button"
path = "src/bin/button.rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
class-button-protocol = { path = "../../crates/class-button-protocol" }

[build-dependencies]
embuild = "0.33"
